<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador Automático de Informes | Scouting</title>
<style>
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --panel2:#16213a;
    --border:#2d3d59;
    --red:#ef4444;
    --green:#22c55e;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --accent:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  h1{
    font-size:22px;
    letter-spacing:.5px;
    border-left:4px solid var(--red);
    padding-left:12px;
    margin-bottom:4px;
  }
  .subtitle{color:var(--muted);margin-bottom:24px;font-size:13px;}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
  }

  .header-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:14px;
  }
  @media (max-width:700px){
    .header-grid{grid-template-columns:1fr 1fr;}
  }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=text], select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px;
    border-radius:6px;
    font-size:14px;
  }
  input[type=text]:focus, select:focus{outline:1px solid var(--accent);}

  .profile-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .profile-title h2{
    font-size:16px;
    margin:0;
    color:var(--red);
  }
  .rating-box{
    display:none;
  }

  .phrase-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
  }
  .phrase-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px 10px;
    cursor:pointer;
    font-size:13.5px;
    line-height:1.4;
  }
  .phrase-item:hover{border-color:var(--accent);}
  .phrase-item input{margin-top:3px;}
  .phrase-item.checked{
    border-color:var(--green);
    background:#132a1e;
  }

  .preview{
    background:var(--panel2);
    border:1px dashed var(--border);
    border-radius:6px;
    padding:10px 12px;
    font-size:13px;
    color:var(--muted);
    min-height:44px;
    white-space:pre-wrap;
  }
  .preview.filled{color:var(--text);}

  .generate-btn{
    display:block;
    width:100%;
    padding:14px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.5px;
    cursor:pointer;
    margin-top:6px;
  }
  .generate-btn:hover{background:#dc2626;}

  #reportOutput{display:none;}
  .report-block{
    border-left:3px solid var(--green);
    padding:12px 16px;
    margin-bottom:12px;
    background:var(--panel2);
    border-radius:0 6px 6px 0;
  }
  .report-block h3{
    margin:0 0 6px 0;
    font-size:14px;
    color:var(--green);
    display:flex;
    justify-content:space-between;
  }
  .report-block p{margin:0;font-size:13.5px;line-height:1.5;color:var(--text);}

  .print-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    margin-top:10px;
  }

  @page{
    size: A4;
    margin: 15mm;
  }
  @media print{
    body{background:#fff;color:#000;padding:0;}
    .wrap{max-width:100%;}
    .card:not(#reportOutput .card){display:none !important;}
    .no-print{display:none !important;}
    #reportOutput{display:block !important;}
    .report-block{background:#fff;border:1px solid #ccc;break-inside:avoid;}
    .report-block h3, .report-block p{color:#000;}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>GENERADOR AUTOMÁTICO DE INFORMES</h1>
  <div class="subtitle">Seleccioná lo que observaste en cancha — el sistema arma el texto por vos</div>

  <!-- DATOS DEL JUGADOR -->
  <div class="card no-print">
    <div class="header-grid">
      <div>
        <label>Nombre del jugador</label>
        <input type="text" id="playerName" placeholder="Ej: Juan Pérez">
      </div>
      <div>
        <label>Equipo</label>
        <input type="text" id="playerTeam" placeholder="Ej: Club Atlético X">
      </div>
      <div>
        <label>Puesto</label>
        <select id="playerPosition" onchange="renderAllProfiles()">
          <option value="">Seleccionar puesto...</option>
        </select>
      </div>
      <div>
        <label>Pie hábil</label>
        <select id="playerFoot">
          <option value="Derecho">Derecho</option>
          <option value="Izquierdo">Izquierdo</option>
          <option value="Ambidiestro">Ambidiestro</option>
        </select>
      </div>
    </div>
  </div>

  <!-- PERFILES -->
  <div id="profilesContainer" class="no-print"></div>

  <!-- BOTÓN GENERAR -->
  <button class="generate-btn no-print" onclick="generateReport()">⚽ GENERAR INFORME</button>

  <!-- INFORME FINAL -->
  <div id="reportOutput">
    <div class="card">
      <div class="header-grid" style="margin-bottom:10px;">
        <div><strong id="outName"></strong></div>
        <div id="outTeam" style="color:var(--muted);"></div>
        <div id="outPosition" style="color:var(--muted);"></div>
        <div id="outFoot" style="color:var(--muted);"></div>
      </div>
    </div>
    <div id="reportBlocks"></div>
    <button class="print-btn no-print" onclick="window.print()">🖨️ Exportar / Imprimir PDF</button>
    <button class="print-btn no-print" style="background:var(--panel2);border:1px solid var(--border);" onclick="backToForm()">✏️ Volver a editar</button>
  </div>

</div>

const PROFILES = [
  {key:"tecnico", label:"Perfil Técnico"},
  {key:"tactico", label:"Perfil Táctico"},
  {key:"fisico", label:"Perfil Físico"},
  {key:"psicologico", label:"Perfil Psicológico"}
];

// Cargar puestos en el select
const posSelect = document.getElementById('playerPosition');
Object.keys(PHRASES).forEach(p=>{
  const opt = document.createElement('option');
  opt.value = p; opt.textContent = p;
  posSelect.appendChild(opt);
});

function renderAllProfiles(){
  const container = document.getElementById('profilesContainer');
  container.innerHTML = "";
  const puesto = posSelect.value;

  if(!puesto){
    container.innerHTML = `<div class="card"><span style="color:var(--muted);font-size:13px;">Elegí un puesto arriba para ver las frases correspondientes.</span></div>`;
    return;
  }

  PROFILES.forEach(profile=>{
    const phrases = PHRASES[puesto][profile.key] || [];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="profile-title">
        <h2>${profile.label}</h2>
      </div>
      <div class="phrase-list" id="list-${profile.key}"></div>
      <div class="preview" id="preview-${profile.key}">El texto se arma automáticamente a medida que tildás frases...</div>
    `;
    container.appendChild(card);

    const list = card.querySelector(`#list-${profile.key}`);
    phrases.forEach((ph, idx)=>{
      const item = document.createElement('label');
      item.className = 'phrase-item';
      item.innerHTML = `<input type="checkbox" data-tone="${ph.tone}" onchange="updatePreview('${profile.key}', this)"> <span>${ph.text}</span>`;
      list.appendChild(item);
    });
  });
}

function updatePreview(profileKey, checkbox){
  const item = checkbox.closest('.phrase-item');
  item.classList.toggle('checked', checkbox.checked);

  const list = document.getElementById(`list-${profileKey}`);
  const checked = Array.from(list.querySelectorAll('input:checked'));
  const preview = document.getElementById(`preview-${profileKey}`);

  if(checked.length === 0){
    preview.textContent = "El texto se arma automáticamente a medida que tildás frases...";
    preview.classList.remove('filled');
  } else {
    const texts = checked.map(c => c.closest('.phrase-item').querySelector('span').textContent);
    preview.textContent = texts.join(' ');
    preview.classList.add('filled');
  }
}

function generateReport(){
  const name = document.getElementById('playerName').value || "Jugador sin nombre";
  const team = document.getElementById('playerTeam').value || "Equipo no especificado";
  const puesto = posSelect.value || "Puesto no especificado";
  const foot = document.getElementById('playerFoot').value;

  if(!posSelect.value){
    alert("Che, primero elegí el puesto del jugador arriba.");
    return;
  }

  document.getElementById('outName').textContent = name;
  document.getElementById('outTeam').textContent = "Equipo: " + team;
  document.getElementById('outPosition').textContent = "Puesto: " + puesto;
  document.getElementById('outFoot').textContent = "Pie hábil: " + foot;

  const blocksContainer = document.getElementById('reportBlocks');
  blocksContainer.innerHTML = "";

  PROFILES.forEach(profile=>{
    const preview = document.getElementById(`preview-${profile.key}`);
    const text = preview.classList.contains('filled')
      ? preview.textContent
      : "Sin observaciones cargadas para este perfil.";

    const block = document.createElement('div');
    block.className = 'report-block';
    block.innerHTML = `
      <h3>${profile.label}</h3>
      <p>${text}</p>
    `;
    blocksContainer.appendChild(block);
  });

  document.getElementById('profilesContainer').style.display = 'none';
  document.querySelector('.generate-btn').style.display = 'none';
  document.getElementById('reportOutput').style.display = 'block';
  window.scrollTo(0,0);
}

function backToForm(){
  document.getElementById('profilesContainer').style.display = 'block';
  document.querySelector('.generate-btn').style.display = 'block';
  document.getElementById('reportOutput').style.display = 'none';
}

// Estado inicial
renderAllProfiles();
</script>
